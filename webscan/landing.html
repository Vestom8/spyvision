<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Spyvision — анализ URL на уязвимости</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #E6F0E8;
      --panel: #FAFDFB;
      --panel-2: #F0F7F2;
      --mint: #C5E8D4;
      --mint-deep: #9ED4B8;
      --green: #2A8F5C;
      --green-dark: #165C3A;
      --moss: #4A7C59;
      --sage: #8FB996;
      --iron: #6E7A72;
      --iron-light: #A3AFA7;
      --border: #C8DCCF;
      --text: #1F2E26;
      --muted: #5A6B60;
      --safe: #3AA66F;
      --high: #B4503C;
      --aurora-lime: #8BE06A;
      --aurora-mint: #5ED9A0;
      --aurora-emerald: #2FBF78;
      --aurora-forest: #1A8F5C;
      --aurora-teal: #2AA88A;
      --lava-hi: #F3FBF7;
      --lava-mint: #D4F0E4;
      --lava-sage: #B5E2D2;
      --lava-sea: #96D4C4;
      --lava-teal: #7EC4B8;
      --lava-deep: #63B3A4;
      --font: "Golos Text", "Segoe UI", sans-serif;
      --font-mono: "IBM Plex Mono", Consolas, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(ellipse 80% 55% at 50% -8%, rgba(139, 224, 106, 0.28), transparent 55%),
        radial-gradient(ellipse 50% 40% at 15% 0%, rgba(94, 217, 160, 0.22), transparent 50%),
        radial-gradient(ellipse 45% 35% at 85% 5%, rgba(42, 168, 138, 0.18), transparent 48%),
        radial-gradient(ellipse 45% 40% at 100% 100%, rgba(158, 212, 184, 0.4), transparent 55%),
        linear-gradient(168deg, #F4FBF6 0%, var(--bg) 42%, var(--mint) 100%);
      background-attachment: fixed;
      font: 15.5px/1.55 var(--font);
      overflow-x: hidden;
    }

    .atmosphere {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    /* Северное сияние — мягкие зелёные завесы сверху */
    .aurora {
      position: absolute;
      top: -8%;
      left: -10%;
      right: -10%;
      height: 58vh;
      overflow: hidden;
      opacity: .85;
      mask-image: linear-gradient(to bottom, #000 35%, transparent 92%);
      -webkit-mask-image: linear-gradient(to bottom, #000 35%, transparent 92%);
    }
    .aurora-band {
      position: absolute;
      inset: -20% -5%;
      border-radius: 40% 60% 50% 50% / 30% 40% 60% 70%;
      filter: blur(28px);
      mix-blend-mode: multiply;
      animation: auroraDrift ease-in-out infinite;
    }
    .aurora-band.a1 {
      background:
        linear-gradient(105deg,
          transparent 8%,
          rgba(139, 224, 106, .55) 22%,
          rgba(47, 191, 120, .42) 38%,
          transparent 52%,
          rgba(94, 217, 160, .5) 68%,
          rgba(26, 143, 92, .35) 82%,
          transparent 95%);
      animation-duration: 14s;
      opacity: .9;
    }
    .aurora-band.a2 {
      background:
        linear-gradient(78deg,
          transparent 5%,
          rgba(42, 168, 138, .4) 28%,
          rgba(139, 224, 106, .48) 45%,
          transparent 60%,
          rgba(47, 191, 120, .38) 75%,
          transparent 92%);
      top: 8%;
      height: 70%;
      filter: blur(36px);
      animation-duration: 18s;
      animation-delay: -4s;
      opacity: .75;
    }
    .aurora-band.a3 {
      background:
        radial-gradient(ellipse 40% 80% at 30% 20%, rgba(139, 224, 106, .45), transparent 70%),
        radial-gradient(ellipse 35% 70% at 70% 35%, rgba(94, 217, 160, .4), transparent 65%),
        radial-gradient(ellipse 30% 60% at 50% 10%, rgba(26, 143, 92, .28), transparent 60%);
      filter: blur(22px);
      animation-duration: 11s;
      animation-delay: -7s;
      opacity: .8;
    }
    @keyframes auroraDrift {
      0%, 100% { transform: translate3d(0, 0, 0) skewX(-2deg) scale(1, 1); }
      33% { transform: translate3d(3%, 2%, 0) skewX(3deg) scale(1.04, .96); }
      66% { transform: translate3d(-4%, 1%, 0) skewX(-4deg) scale(.97, 1.05); }
    }

    .lava-svg {
      position: absolute;
      width: 0;
      height: 0;
      overflow: hidden;
    }
    .lava-lamp {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }
    /* Мягкое холодное свечение у дна */
    .lava-heat {
      position: absolute;
      left: -10%;
      right: -10%;
      bottom: -14%;
      height: 28%;
      background:
        radial-gradient(ellipse 60% 70% at 50% 100%, rgba(190, 235, 220, .45), transparent 70%),
        radial-gradient(ellipse 80% 55% at 30% 100%, rgba(170, 220, 210, .28), transparent 62%),
        radial-gradient(ellipse 70% 50% at 70% 100%, rgba(150, 210, 200, .22), transparent 58%);
      filter: blur(36px);
      opacity: .75;
    }
    /* Metaball / goo — пузыри тянутся и сливаются с лужей */
    .lava-goo {
      position: absolute;
      inset: 0;
      filter: url(#lava-goo) blur(1.2px)
        drop-shadow(0 0 22px rgba(160, 220, 200, .35))
        drop-shadow(0 0 48px rgba(140, 205, 190, .18));
      transform: translateZ(0);
    }
    .lava-pool {
      position: absolute;
      left: 2%;
      right: 2%;
      bottom: -16%;
      height: 22%;
      border-radius: 48% 52% 40% 42% / 60% 55% 40% 45%;
      background:
        radial-gradient(ellipse 55% 50% at 22% 30%, var(--lava-hi) 0%, transparent 52%),
        radial-gradient(ellipse 48% 46% at 78% 38%, var(--lava-mint) 0%, transparent 50%),
        linear-gradient(125deg,
          var(--lava-mint) 0%,
          var(--lava-sage) 28%,
          var(--lava-sea) 55%,
          var(--lava-teal) 78%,
          var(--lava-deep) 100%),
        radial-gradient(ellipse 90% 100% at 50% 70%,
          var(--lava-sage) 0%,
          var(--lava-sea) 40%,
          var(--lava-teal) 70%,
          var(--lava-deep) 100%);
      background-blend-mode: soft-light, soft-light, normal, normal;
      opacity: .8;
      filter: blur(2px);
      animation: lavaPool 18s cubic-bezier(0.42, 0.05, 0.58, 0.95) infinite;
    }
    /* Лужа «принимает» капли — лёгкая рябь */
    @keyframes lavaPool {
      0%, 100% { transform: scale(1, 1) translateY(0); border-radius: 48% 52% 40% 42% / 60% 55% 40% 45%; }
      22% { transform: scale(1.04, .9) translateY(3%); border-radius: 52% 48% 45% 40% / 50% 58% 38% 48%; }
      48% { transform: scale(.98, 1.05) translateY(-1%); border-radius: 44% 56% 38% 48% / 62% 48% 48% 40%; }
      72% { transform: scale(1.06, .88) translateY(4%); border-radius: 55% 45% 48% 38% / 48% 55% 42% 52%; }
    }
    .lava-blob {
      position: absolute;
      bottom: 2%;
      display: block;
      will-change: transform, border-radius, background-position;
      background:
        radial-gradient(circle at 32% 26%,
          var(--lava-hi) 0%,
          transparent 42%),
        linear-gradient(155deg,
          var(--lava-hi) 0%,
          var(--lava-mint) 22%,
          var(--lava-sage) 45%,
          var(--lava-sea) 68%,
          var(--lava-teal) 85%,
          var(--lava-deep) 100%);
      background-size: 100% 100%, 140% 140%;
      background-position: center, 30% 20%;
      opacity: .84;
      filter: blur(1.5px);
      border-radius: 48% 52% 45% 55% / 55% 48% 52% 45%;
      animation:
        lavaFloat var(--lava-float, 40s) cubic-bezier(0.4, 0.0, 0.2, 1) infinite,
        lavaMorph var(--lava-morph, 16s) cubic-bezier(0.45, 0.02, 0.55, 0.98) infinite,
        lavaGradShift calc(var(--lava-float, 40s) * .85) ease-in-out infinite;
    }
    .lava-blob::before,
    .lava-blob::after {
      content: "";
      position: absolute;
      border-radius: inherit;
      pointer-events: none;
    }
    .lava-blob::before {
      inset: 14% 20% auto 16%;
      height: 26%;
      background: radial-gradient(ellipse at 40% 40%,
        rgba(255, 255, 255, .8) 0%,
        rgba(243, 251, 247, .4) 45%,
        transparent 72%);
      filter: blur(2px);
    }
    .lava-blob::after {
      inset: auto 12% 10% 20%;
      height: 36%;
      background: linear-gradient(180deg,
        transparent 0%,
        rgba(99, 179, 164, .22) 55%,
        rgba(126, 196, 184, .18) 100%);
      filter: blur(1px);
    }
    .lava-blob.b1 {
      left: 14%; width: 176px; height: 196px;
      --lava-float: 38s; --lava-morph: 15s;
      animation-delay: 0s, 0s, 0s;
      background:
        radial-gradient(circle at 30% 24%, var(--lava-hi) 0%, transparent 40%),
        linear-gradient(148deg, var(--lava-hi), var(--lava-mint) 30%, var(--lava-sage) 55%, var(--lava-teal) 80%, var(--lava-deep));
      background-size: 100% 100%, 150% 150%;
    }
    .lava-blob.b2 {
      left: 34%; width: 154px; height: 178px;
      --lava-float: 46s; --lava-morph: 18s;
      animation-delay: -12s, -4s, -5s;
      background:
        radial-gradient(circle at 38% 30%, var(--lava-hi) 0%, transparent 42%),
        linear-gradient(168deg, var(--lava-mint), var(--lava-sage) 35%, var(--lava-sea) 60%, var(--lava-deep));
      background-size: 100% 100%, 150% 150%;
    }
    .lava-blob.b3 {
      left: 52%; width: 198px; height: 214px;
      --lava-float: 50s; --lava-morph: 17s;
      animation-delay: -22s, -8s, -10s;
      background:
        radial-gradient(circle at 28% 28%, var(--lava-hi) 0%, transparent 44%),
        linear-gradient(135deg, var(--lava-hi), var(--lava-sage) 28%, var(--lava-sea) 52%, var(--lava-teal) 75%, var(--lava-deep));
      background-size: 100% 100%, 150% 150%;
    }
    .lava-blob.b4 {
      left: 70%; width: 162px; height: 186px;
      --lava-float: 42s; --lava-morph: 14s;
      animation-delay: -6s, -2s, -3s;
      background:
        radial-gradient(circle at 35% 22%, var(--lava-hi) 0%, transparent 40%),
        linear-gradient(160deg, var(--lava-mint), var(--lava-sea) 40%, var(--lava-teal) 70%, var(--lava-deep));
      background-size: 100% 100%, 150% 150%;
    }
    @keyframes lavaGradShift {
      0%, 100% { background-position: center, 25% 15%; }
      50% { background-position: center, 75% 80%; }
    }
    .lava-speck {
      position: absolute;
      bottom: 4%;
      display: block;
      border-radius: 50%;
      background:
        radial-gradient(circle at 35% 30%,
          var(--lava-hi) 0%,
          var(--lava-mint) 40%,
          var(--lava-sea) 75%,
          var(--lava-teal) 100%);
      opacity: .72;
      filter: blur(1.2px);
      animation: lavaSpeck var(--speck-dur, 30s) cubic-bezier(0.4, 0.0, 0.2, 1) infinite;
    }
    .lava-speck.s1 { left: 24%; width: 28px; height: 32px; --speck-dur: 28s; animation-delay: -3s; }
    .lava-speck.s2 { left: 46%; width: 22px; height: 26px; --speck-dur: 33s; animation-delay: -11s; }
    .lava-speck.s3 { left: 62%; width: 34px; height: 38px; --speck-dur: 31s; animation-delay: -17s; }
    .lava-speck.s4 { left: 78%; width: 20px; height: 24px; --speck-dur: 26s; animation-delay: -7s; }
    /* Непрерывный цикл: выход из лужи → подъём → сразу спуск → слияние с лужей */
    @keyframes lavaFloat {
      0% {
        transform: translate3d(0, 14%, 0) scale(1.22, .72);
      }
      8% {
        transform: translate3d(.3%, 6%, 0) scale(.68, 1.4);
      }
      18% {
        transform: translate3d(-.7%, -12vh, 0) scale(.9, 1.14);
      }
      30% {
        transform: translate3d(.9%, -30vh, 0) scale(.98, 1.04);
      }
      42% {
        transform: translate3d(-.4%, -48vh, 0) scale(1.04, .96);
      }
      50% {
        transform: translate3d(0, -58vh, 0) scale(1.1, .88);
      }
      58% {
        transform: translate3d(.5%, -50vh, 0) scale(.85, 1.2);
      }
      70% {
        transform: translate3d(-.8%, -32vh, 0) scale(.92, 1.1);
      }
      82% {
        transform: translate3d(.4%, -14vh, 0) scale(1.0, 1.0);
      }
      90% {
        transform: translate3d(0, -2vh, 0) scale(.7, 1.35);
      }
      96% {
        transform: translate3d(0, 8%, 0) scale(1.08, .82);
      }
      100% {
        transform: translate3d(0, 14%, 0) scale(1.22, .72);
      }
    }
    @keyframes lavaMorph {
      0%, 100% { border-radius: 46% 54% 42% 58% / 58% 46% 54% 42%; }
      15% { border-radius: 60% 40% 55% 45% / 40% 60% 40% 60%; }
      30% { border-radius: 40% 60% 48% 52% / 62% 38% 58% 42%; }
      45% { border-radius: 55% 45% 38% 62% / 48% 52% 38% 62%; }
      60% { border-radius: 42% 58% 58% 42% / 55% 45% 55% 45%; }
      75% { border-radius: 58% 42% 45% 55% / 42% 58% 48% 52%; }
      90% { border-radius: 48% 52% 60% 40% / 52% 48% 40% 60%; }
    }
    @keyframes lavaSpeck {
      0% { transform: translate3d(0, 12%, 0) scale(1.15, .8); opacity: .4; }
      10% { transform: translate3d(1%, 2%, 0) scale(.75, 1.25); opacity: .75; }
      28% { transform: translate3d(2%, -20vh, 0) scale(.92, 1.1); opacity: .8; }
      48% { transform: translate3d(-1.5%, -46vh, 0) scale(1.1, .9); opacity: .75; }
      52% { transform: translate3d(0, -52vh, 0) scale(1.15, .85); opacity: .7; }
      68% { transform: translate3d(1%, -30vh, 0) scale(.88, 1.15); opacity: .8; }
      85% { transform: translate3d(-.5%, -8vh, 0) scale(.72, 1.3); opacity: .65; }
      94% { transform: translate3d(0, 6%, 0) scale(1.05, .88); opacity: .5; }
      100% { transform: translate3d(0, 12%, 0) scale(1.15, .8); opacity: .4; }
    }
    @media (prefers-reduced-motion: reduce) {
      .lava-blob, .lava-speck, .lava-pool {
        animation: none !important;
        transform: none !important;
        opacity: .55;
      }
      .aurora-band { animation: none !important; }
    }

    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 72px 20px 64px;
      overflow: visible;
    }

    .hero-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      transform: translateY(6vh);
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-bottom: 18px;
      animation: brandIn .75s cubic-bezier(.22,1,.36,1) both;
      position: relative;
      z-index: 2;
    }

    @keyframes brandIn {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: none; }
    }

    .mascot-wrap {
      position: relative;
      flex: none;
      width: clamp(90px, 13vw, 112px);
      height: clamp(100px, 15vw, 124px);
      /* паук на нити на одном уровне с надписью Spyvision */
      align-self: center;
      margin-top: 10px;
      animation: float 3.6s ease-in-out infinite;
      overflow: visible;
    }
    .silk-up {
      position: absolute;
      left: 50%;
      bottom: calc(100% - 8px);
      width: 1.5px;
      height: 100vh;
      margin-left: -0.75px;
      background: #858585;
      opacity: .82;
      pointer-events: none;
      z-index: 0;
      border-radius: 1px;
    }
    .silk-up::before {
      content: "";
      position: absolute;
      top: 0;
      left: 50%;
      width: 5px;
      height: 5px;
      margin: -2px 0 0 -2.5px;
      border-radius: 50%;
      background: #858585;
      opacity: .7;
    }
    .mascot {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      display: block;
      filter: drop-shadow(0 6px 14px rgba(38, 48, 43, .14));
      overflow: visible;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    .logo {
      display: block;
      height: clamp(88px, 16vw, 128px);
      width: auto;
      max-width: min(720px, 94vw);
      overflow: visible;
      filter: drop-shadow(0 8px 20px rgba(38, 48, 43, .12));
    }

    .tagline {
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 15px;
      font-weight: 500;
      letter-spacing: .01em;
      text-align: center;
      max-width: 28em;
      animation: brandIn .75s .1s cubic-bezier(.22,1,.36,1) both;
    }

    .search-wrap {
      width: min(560px, 100%);
      margin: 0 auto;
      animation: brandIn .75s .16s cubic-bezier(.22,1,.36,1) both;
    }

    .search {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      height: 58px;
      padding: 0 8px 0 18px;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid var(--border);
      border-radius: 20px;
      backdrop-filter: blur(12px);
      box-shadow: 0 2px 12px rgba(38, 48, 43, .06);
      transition: box-shadow .2s, border-color .2s;
    }
    .search:hover {
      border-color: var(--mint-deep);
      box-shadow: 0 4px 16px rgba(38, 48, 43, .08);
    }
    .search:focus-within {
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(42, 143, 92, .16), 0 4px 16px rgba(31, 46, 38, .08);
    }
    .search-ico { flex: none; color: var(--green); display: flex; opacity: .85; }
    .search input {
      flex: 1; min-width: 0; border: none; outline: none; background: transparent;
      font: 500 15px/1.4 var(--font-mono); color: var(--text);
    }
    .search input::placeholder {
      color: var(--iron-light); font-family: var(--font); font-weight: 400;
    }

    .scan-btn {
      position: relative;
      isolation: isolate;
      flex: none;
      height: 40px;
      padding: 0 20px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.9);
      color: var(--text);
      font: 600 13.5px/1 var(--font);
      letter-spacing: .01em;
      cursor: pointer;
      transition: color .2s, border-color .2s, background .2s;
      box-shadow: none;
      z-index: 0;
    }
    .scan-btn::before {
      content: "";
      position: absolute;
      inset: -2px;
      border-radius: inherit;
      padding: 2px;
      background: conic-gradient(from 180deg, #C5E8D4, #9ED4B8, #8BE06A, #3AA66F, #2A8F5C, #165C3A, #2AA88A, #C5E8D4);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      opacity: 0;
      transition: opacity .25s ease;
      pointer-events: none;
      z-index: -1;
    }
    .scan-btn:hover { color: var(--green-dark); border-color: transparent; background: #fff; }
    .scan-btn:hover::before { opacity: 1; }
    .scan-btn:active { transform: translateY(1px); }
    .scan-btn:disabled { opacity: .7; cursor: wait; }

    .error {
      margin-top: 12px; text-align: center; font-size: 13.5px; font-weight: 500;
      color: var(--high); min-height: 1.2em; opacity: 0; transition: opacity .2s;
    }
    .error.show { opacity: 1; }

    .hint {
      margin-top: 14px; text-align: center; font-size: 13px; color: var(--muted);
    }
    .hint a {
      color: var(--green); text-decoration: none; border-bottom: 1px dotted var(--mint-deep);
      margin: 0 4px;
    }
    .hint a:hover { color: var(--green-dark); border-bottom-color: var(--green); }

    .matrix-digits {
      font-family: Consolas, "Courier New", monospace;
      font-size: 5px; fill: #3F9D75; opacity: .85;
    }
    .eye-glow { animation: eyePulse 2.4s ease-in-out infinite; }
    @keyframes eyePulse {
      0%, 100% { opacity: .55; }
      50% { opacity: 1; }
    }
    .leg-group {
      transform-origin: 60px 54px;
      animation: legWiggle 4s ease-in-out infinite;
    }
    @keyframes legWiggle {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(.8deg); }
    }

    footer {
      position: absolute;
      left: 0; right: 0; bottom: 18px;
      width: 100%;
      text-align: center;
      font-size: 12.5px;
      font-weight: 500;
      color: var(--muted);
      opacity: .9;
      pointer-events: none;
    }

    /* ---------- экран загрузки скана ---------- */
    .scan-overlay {
      position: fixed; inset: 0; z-index: 50;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background:
        radial-gradient(ellipse 60% 50% at 50% 42%, rgba(255,255,255,.92), transparent 70%),
        rgba(238, 242, 238, .88);
      backdrop-filter: blur(10px);
      opacity: 0; visibility: hidden;
      transition: opacity .28s ease, visibility .28s ease;
    }
    .scan-overlay.open { opacity: 1; visibility: visible; }
    .scan-stage {
      position: relative;
      width: min(280px, 72vw);
      height: min(280px, 72vw);
    }
    .scan-stage svg { width: 100%; height: 100%; display: block; overflow: visible; }
    .web-ring {
      fill: none; stroke: #858585; stroke-linecap: round;
      transform-origin: 140px 140px;
      opacity: .55;
      stroke-dasharray: 12 10;
      animation: webSpin 8s linear infinite;
    }
    .web-ring.r1 { stroke-width: 1.1; animation-duration: 10s; }
    .web-ring.r2 { stroke-width: 1.2; animation-duration: 7.5s; animation-direction: reverse; }
    .web-ring.r3 { stroke-width: 1.3; animation-duration: 6s; }
    .web-spoke {
      stroke: #9AA39D; stroke-width: .9; opacity: .5;
      transform-origin: 140px 140px;
      animation: webSpin 12s linear infinite;
    }
    .web-draw {
      fill: none; stroke: #2C7A5B; stroke-width: 1.6; stroke-linecap: round;
      stroke-dasharray: 220; stroke-dashoffset: 220;
      animation: weaveDraw 2.8s ease-in-out infinite;
      opacity: .75;
    }
    @keyframes webSpin {
      to { transform: rotate(360deg); }
    }
    @keyframes weaveDraw {
      0% { stroke-dashoffset: 220; opacity: .2; }
      45% { stroke-dashoffset: 0; opacity: .85; }
      100% { stroke-dashoffset: -220; opacity: .2; }
    }
    .load-spider {
      transform-origin: 140px 148px;
      animation: spiderPulse 2.4s ease-in-out infinite;
    }
    @keyframes spiderPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03); }
    }
    .load-legs {
      transform-origin: 140px 150px;
      animation: loadLegs 1.8s ease-in-out infinite;
    }
    @keyframes loadLegs {
      0%, 100% { transform: rotate(-2deg); }
      50% { transform: rotate(2deg); }
    }
    .load-loupe {
      transform-origin: 140px 118px;
      animation: loupeOrbit 3.2s ease-in-out infinite;
    }
    @keyframes loupeOrbit {
      0% { transform: rotate(-28deg) translate(34px, -6px) rotate(12deg); }
      50% { transform: rotate(32deg) translate(34px, -6px) rotate(-8deg); }
      100% { transform: rotate(-28deg) translate(34px, -6px) rotate(12deg); }
    }
    .scan-status {
      margin-top: 28px;
      min-height: 1.5em;
      text-align: center;
      font: 600 16px/1.4 var(--font);
      color: var(--green-dark);
      letter-spacing: .01em;
    }
    .scan-status-dots::after {
      content: "";
      animation: dots 1.4s steps(4, end) infinite;
    }
    @keyframes dots {
      0% { content: ""; }
      25% { content: "."; }
      50% { content: ".."; }
      75% { content: "..."; }
    }
    .scan-sub {
      margin-top: 8px;
      font-size: 13px;
      color: var(--muted);
      text-align: center;
    }

    @media (max-width: 560px) {
      .hero-center { transform: translateY(3vh); }
      .logo { height: clamp(64px, 18vw, 88px); }
      .mascot-wrap { width: 88px; height: 100px; margin-top: 6px; }
      .brand { gap: 8px; margin-bottom: 14px; }
      .tagline { font-size: 13.5px; margin-bottom: 18px; }
      .search { height: 50px; padding-left: 14px; }
      .scan-btn { padding: 0 14px; font-size: 13px; }
      .lava-blob.b1 { width: 120px; height: 136px; }
      .lava-blob.b2 { width: 108px; height: 124px; }
      .lava-blob.b3 { width: 132px; height: 148px; }
      .lava-blob.b4 { width: 112px; height: 128px; }
      .lava-speck { transform: scale(.85); }
      .aurora { height: 48vh; opacity: .7; }
      .scan-status { font-size: 14.5px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .web-ring, .web-spoke, .web-draw, .load-spider, .load-legs, .load-loupe, .scan-status-dots::after {
        animation: none !important;

    </div>
    <p class="scan-status"><span id="scanStatus">Ищем уязвимости</span><span class="scan-status-dots"></span></p>
    <p class="scan-sub">Это может занять несколько минут — не закрывайте вкладку</p>
  </div>

  <script>
    (function () {
      var form = document.getElementById("scanForm");
      var input = document.getElementById("urlInput");
      var error = document.getElementById("urlError");
      var button = form.querySelector(".scan-btn");
      var overlay = document.getElementById("scanOverlay");
      var statusEl = document.getElementById("scanStatus");
      var statusTimer = null;
      var STATUS_MESSAGES = [
        "Подключаемся к сайту",
        "Обходим страницы",
        "Проверяем заголовки и cookies",
        "SAST: анализируем HTML и JavaScript",
        "Ищем служебные файлы (.git, .env, бэкапы)",
        "Проверяем тестовые и staging-разделы",
        "Broken Access Control: админки и IDOR",
        "Проверяем HTTPS, TLS и CORS",
        "Ищем признаки WAF и обходы фильтров",
        "DAST: активные тесты внедрения",
        "Собираем доказательства",
        "Формируем отчёт"
      ];

      function showError(msg) {
        error.style.color = "";
        error.textContent = msg || "";
        error.classList.toggle("show", !!msg);
      }

      function showOk(msg) {
        error.style.color = "var(--green)";
        error.textContent = msg;
        error.classList.add("show");
      }

      function setBusy(busy) {
        button.disabled = busy;
        input.disabled = busy;
        button.textContent = busy ? "Сканирование…" : "Сканировать";
        if (busy) {
          showScanOverlay();
        } else {
          hideScanOverlay();
        }
      }

      function showScanOverlay() {
        if (!overlay) return;
        var i = 0;
        statusEl.textContent = STATUS_MESSAGES[0];
        overlay.classList.add("open");
        overlay.setAttribute("aria-hidden", "false");
        clearInterval(statusTimer);
        statusTimer = setInterval(function () {
          i = (i + 1) % STATUS_MESSAGES.length;
          statusEl.textContent = STATUS_MESSAGES[i];
        }, 3200);
      }

      function hideScanOverlay() {
        if (!overlay) return;
        overlay.classList.remove("open");
        overlay.setAttribute("aria-hidden", "true");
        clearInterval(statusTimer);
        statusTimer = null;
      }

      function looksLikeUrl(value) {
        var v = value.trim();
        if (!v) return false;
        if (/^https?:\/\//i.test(v)) return true;
        if (/^[a-z0-9.-]+(?::\d{1,5})?(?:\/\S*)?$/i.test(v)) return true;
        if (/^\d{1,3}(?:\.\d{1,3}){3}(?::\d{1,5})?(?:\/\S*)?$/.test(v)) return true;
        if (/^\[[0-9a-f:]+\](?::\d{1,5})?(?:\/\S*)?$/i.test(v)) return true;
        return false;
      }

      function isFilePage() {
        return location.protocol === "file:";
      }

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        var value = input.value.trim();
        if (!value) {
          showError("Введите адрес для сканирования");
          input.focus();
          return;
        }
        if (!looksLikeUrl(value)) {
          showError("Похоже, это не URL. Пример: https://example.com");
          input.focus();
          return;
        }
        if (isFilePage()) {
          showError("Не удалось связаться с локальным сервером Spyvision. Запустите: python scan.py");
          return;
        }
        setBusy(true);
        showError("");
        fetch("/api/scan", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url: value })
        })
          .then(function (resp) {
            return resp.json().then(function (data) {
              return { ok: resp.ok, status: resp.status, data: data };
            }).catch(function () {
              return { ok: false, status: resp.status, data: { error: "Некорректный ответ сервера" } };
            });
          })
          .then(function (result) {
            if (result.ok && result.data && result.data.ok) {
              if (statusEl) statusEl.textContent = "Готово — открываем отчёт";
              var target = result.data.report_url || "/report.html";
              location.href = target;
              return;
            }
            var msg = (result.data && result.data.error)
              || ("Ошибка сканирования (HTTP " + result.status + ")");
            showError(msg);
            setBusy(false);
          })
          .catch(function () {
            showError("Не удалось связаться с локальным сервером Spyvision. Запустите: python scan.py");
            setBusy(false);
          });
      });

      document.querySelectorAll("[data-url]").forEach(function (link) {
        link.addEventListener("click", function (e) {
          e.preventDefault();
          input.value = link.getAttribute("data-url");
          input.focus();
          showError("");
        });
      });

      var rain = document.querySelector(".matrix-rain");
      if (rain) {
        var y = 0;
        setInterval(function () {
          y = (y + 1) % 12;
          rain.setAttribute("transform", "translate(0," + y + ")");
        }, 120);
      }

      if (isFilePage()) {
        showError("Не удалось связаться с локальным сервером Spyvision. Запустите: python scan.py");
      }
    })();
  </script>
</body>
</html>
