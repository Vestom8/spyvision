<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Spyvision — анализ URL на уязвимости</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #EEF2EE;
      --panel: #FFFFFF;
      --panel-2: #F4F8F5;
      --mint: #D8F1E6;
      --mint-deep: #BFE4D3;
      --green: #2C7A5B;
      --green-dark: #1E5A42;
      --iron: #858585;
      --iron-light: #B7B7B7;
      --border: #D7E1DA;
      --text: #26302B;
      --muted: #64716A;
      --safe: #3F9D75;
      --high: #B4503C;
      --font: "Golos Text", "Segoe UI", sans-serif;
      --font-mono: "IBM Plex Mono", Consolas, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(ellipse 70% 50% at 50% -5%, rgba(216, 241, 230, 0.95), transparent 58%),
        radial-gradient(ellipse 45% 40% at 100% 100%, rgba(191, 228, 211, 0.45), transparent 55%),
        linear-gradient(165deg, #FFFFFF 0%, var(--bg) 48%, var(--mint) 100%);
      background-attachment: fixed;
      font: 15.5px/1.55 var(--font);
      overflow-x: hidden;
    }

    .atmosphere {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .lava-lamp { position: absolute; inset: 0; overflow: hidden; }
    .lava-pool {
      position: absolute;
      left: -5%; right: -5%; bottom: -8%;
      height: 38%;
      background:
        radial-gradient(ellipse 70% 55% at 30% 80%, rgba(63, 157, 117, .45), transparent 60%),
        radial-gradient(ellipse 60% 50% at 70% 90%, rgba(44, 122, 91, .4), transparent 55%),
        linear-gradient(to top,
          rgba(30, 90, 66, .42) 0%,
          rgba(44, 122, 91, .28) 35%,
          rgba(63, 157, 117, .14) 65%,
          transparent 100%);
      filter: blur(2px);
    }
    .lava-blob {
      position: absolute;
      bottom: 4%;
      will-change: transform, border-radius;
      background:
        radial-gradient(circle at 32% 28%,
          rgba(232, 247, 239, .95) 0%,
          rgba(191, 228, 211, .75) 28%,
          rgba(63, 157, 117, .62) 55%,
          rgba(44, 122, 91, .5) 78%,
          rgba(30, 90, 66, .35) 100%);
      box-shadow:
        inset 0 -8px 18px rgba(30, 90, 66, .25),
        0 0 22px rgba(63, 157, 117, .28);
      filter: blur(.6px);
      opacity: .78;
      animation: lavaBlob ease-in-out infinite;
    }
    .lava-blob.b1 { left: 8%;  width: 92px; height: 110px; animation-duration: 11s; animation-delay: 0s; }
    .lava-blob.b2 { left: 22%; width: 64px; height: 78px;  animation-duration: 13.5s; animation-delay: -2.4s; }
    .lava-blob.b3 { left: 38%; width: 118px; height: 128px; animation-duration: 15s; animation-delay: -5s; }
    .lava-blob.b4 { left: 52%; width: 72px; height: 88px;  animation-duration: 12.2s; animation-delay: -1.2s; }
    .lava-blob.b5 { left: 66%; width: 100px; height: 116px; animation-duration: 14s; animation-delay: -7s; }
    .lava-blob.b6 { left: 78%; width: 58px; height: 70px;  animation-duration: 10.5s; animation-delay: -3.6s; }
    .lava-blob.b7 { left: 14%; width: 48px; height: 56px;  animation-duration: 9.8s; animation-delay: -6.2s; }
    .lava-blob.b8 { left: 44%; width: 82px; height: 96px;  animation-duration: 16s; animation-delay: -9s; }
    .lava-blob.b9 { left: 86%; width: 70px; height: 84px;  animation-duration: 12.8s; animation-delay: -4.5s; }
    @keyframes lavaBlob {
      0% { transform: translate3d(0, 8%, 0) scale(1, .92); border-radius: 48% 52% 45% 55% / 55% 48% 52% 45%; }
      12% { transform: translate3d(2%, -12vh, 0) scale(1.06, .88); border-radius: 55% 45% 52% 48% / 42% 58% 42% 58%; }
      28% { transform: translate3d(-3%, -32vh, 0) scale(.92, 1.08); border-radius: 42% 58% 48% 52% / 58% 42% 55% 45%; }
      42% { transform: translate3d(4%, -52vh, 0) scale(1.08, .9); border-radius: 58% 42% 55% 45% / 48% 52% 42% 58%; }
      50% { transform: translate3d(0, -68vh, 0) scale(1.12, .82); border-radius: 50% 50% 42% 58% / 55% 45% 55% 45%; }
      58% { transform: translate3d(-2%, -62vh, 0) scale(.95, 1.05); border-radius: 45% 55% 48% 52% / 42% 58% 48% 52%; }
      72% { transform: translate3d(3%, -36vh, 0) scale(1.04, .92); border-radius: 52% 48% 55% 45% / 58% 42% 52% 48%; }
      88% { transform: translate3d(-1%, -12vh, 0) scale(.96, 1.04); border-radius: 48% 52% 42% 58% / 45% 55% 48% 52%; }
      100% { transform: translate3d(0, 8%, 0) scale(1, .92); border-radius: 48% 52% 45% 55% / 55% 48% 52% 45%; }
    }
    @media (prefers-reduced-motion: reduce) {
      .lava-blob { animation: none !important; transform: translateY(0) !important; opacity: .55; }
    }

    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 72px 20px 64px;
      overflow: visible;
    }

    .hero-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      transform: translateY(6vh);
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-bottom: 18px;
      animation: brandIn .75s cubic-bezier(.22,1,.36,1) both;
      position: relative;
      z-index: 2;
    }

    @keyframes brandIn {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: none; }
    }

    .mascot-wrap {
      position: relative;
      flex: none;
      width: clamp(90px, 13vw, 112px);
      height: clamp(100px, 15vw, 124px);
      /* паук на нити на одном уровне с надписью Spyvision */
      align-self: center;
      margin-top: 10px;
      animation: float 3.6s ease-in-out infinite;
      overflow: visible;
    }
    .silk-up {
      position: absolute;
      left: 50%;
      bottom: calc(100% - 8px);
      width: 1.5px;
      height: 100vh;
      margin-left: -0.75px;
      background: #858585;
      opacity: .82;
      pointer-events: none;
      z-index: 0;
      border-radius: 1px;
    }
    .silk-up::before {
      content: "";
      position: absolute;
      top: 0;
      left: 50%;
      width: 5px;
      height: 5px;
      margin: -2px 0 0 -2.5px;
      border-radius: 50%;
      background: #858585;
      opacity: .7;
    }
    .mascot {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      display: block;
      filter: drop-shadow(0 6px 14px rgba(38, 48, 43, .14));
      overflow: visible;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    .logo {
      display: block;
      height: clamp(88px, 16vw, 128px);
      width: auto;
      max-width: min(720px, 94vw);
      overflow: visible;
      filter: drop-shadow(0 8px 20px rgba(38, 48, 43, .12));
    }

    .tagline {
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 15px;
      font-weight: 500;
      letter-spacing: .01em;
      text-align: center;
      max-width: 28em;
      animation: brandIn .75s .1s cubic-bezier(.22,1,.36,1) both;
    }

    .search-wrap {
      width: min(560px, 100%);
      margin: 0 auto;
      animation: brandIn .75s .16s cubic-bezier(.22,1,.36,1) both;
    }

    .search {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      height: 58px;
      padding: 0 8px 0 18px;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid var(--border);
      border-radius: 20px;
      backdrop-filter: blur(12px);
      box-shadow: 0 2px 12px rgba(38, 48, 43, .06);
      transition: box-shadow .2s, border-color .2s;
    }
    .search:hover {
      border-color: var(--mint-deep);
      box-shadow: 0 4px 16px rgba(38, 48, 43, .08);
    }
    .search:focus-within {
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(44, 122, 91, .14), 0 4px 16px rgba(38, 48, 43, .08);
    }
    .search-ico { flex: none; color: var(--green); display: flex; opacity: .85; }
    .search input {
      flex: 1; min-width: 0; border: none; outline: none; background: transparent;
      font: 500 15px/1.4 var(--font-mono); color: var(--text);
    }
    .search input::placeholder {
      color: var(--iron-light); font-family: var(--font); font-weight: 400;
    }

    .scan-btn {
      position: relative;
      isolation: isolate;
      flex: none;
      height: 40px;
      padding: 0 20px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.9);
      color: var(--text);
      font: 600 13.5px/1 var(--font);
      letter-spacing: .01em;
      cursor: pointer;
      transition: color .2s, border-color .2s, background .2s;
      box-shadow: none;
      z-index: 0;
    }
    .scan-btn::before {
      content: "";
      position: absolute;
      inset: -2px;
      border-radius: inherit;
      padding: 2px;
      background: conic-gradient(from 180deg, #D8F1E6, #BFE4D3, #3F9D75, #2C7A5B, #1E5A42, #3F9D75, #BFE4D3, #D8F1E6);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      opacity: 0;
      transition: opacity .25s ease;
      pointer-events: none;
      z-index: -1;
    }
    .scan-btn:hover { color: var(--green-dark); border-color: transparent; background: #fff; }
    .scan-btn:hover::before { opacity: 1; }
    .scan-btn:active { transform: translateY(1px); }
    .scan-btn:disabled { opacity: .7; cursor: wait; }

    .error {
      margin-top: 12px; text-align: center; font-size: 13.5px; font-weight: 500;
      color: var(--high); min-height: 1.2em; opacity: 0; transition: opacity .2s;
    }
    .error.show { opacity: 1; }

    .hint {
      margin-top: 14px; text-align: center; font-size: 13px; color: var(--muted);
    }
    .hint a {
      color: var(--green); text-decoration: none; border-bottom: 1px dotted var(--mint-deep);
      margin: 0 4px;
    }
    .hint a:hover { color: var(--green-dark); border-bottom-color: var(--green); }

    .matrix-digits {
      font-family: Consolas, "Courier New", monospace;
      font-size: 5px; fill: #3F9D75; opacity: .85;
    }
    .eye-glow { animation: eyePulse 2.4s ease-in-out infinite; }
    @keyframes eyePulse {
      0%, 100% { opacity: .55; }
      50% { opacity: 1; }
    }
    .leg-group {
      transform-origin: 60px 54px;
      animation: legWiggle 4s ease-in-out infinite;
    }
    @keyframes legWiggle {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(.8deg); }
    }

    footer {
      position: absolute;
      left: 0; right: 0; bottom: 18px;
      width: 100%;
      text-align: center;
      font-size: 12.5px;
      font-weight: 500;
      color: var(--muted);
      opacity: .9;
      pointer-events: none;
    }

    /* ---------- экран загрузки скана ---------- */
    .scan-overlay {
      position: fixed; inset: 0; z-index: 50;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background:
        radial-gradient(ellipse 60% 50% at 50% 42%, rgba(255,255,255,.92), transparent 70%),
        rgba(238, 242, 238, .88);
      backdrop-filter: blur(10px);
      opacity: 0; visibility: hidden;
      transition: opacity .28s ease, visibility .28s ease;
    }
    .scan-overlay.open { opacity: 1; visibility: visible; }
    .scan-stage {
      position: relative;
      width: min(280px, 72vw);
      height: min(280px, 72vw);
    }
    .scan-stage svg { width: 100%; height: 100%; display: block; overflow: visible; }
    .web-ring {
      fill: none; stroke: #858585; stroke-linecap: round;
      transform-origin: 140px 140px;
      opacity: .55;
      stroke-dasharray: 12 10;
      animation: webSpin 8s linear infinite;
    }
    .web-ring.r1 { stroke-width: 1.1; animation-duration: 10s; }
    .web-ring.r2 { stroke-width: 1.2; animation-duration: 7.5s; animation-direction: reverse; }
    .web-ring.r3 { stroke-width: 1.3; animation-duration: 6s; }
    .web-spoke {
      stroke: #9AA39D; stroke-width: .9; opacity: .5;
      transform-origin: 140px 140px;
      animation: webSpin 12s linear infinite;
    }
    .web-draw {
      fill: none; stroke: #2C7A5B; stroke-width: 1.6; stroke-linecap: round;
      stroke-dasharray: 220; stroke-dashoffset: 220;
      animation: weaveDraw 2.8s ease-in-out infinite;
      opacity: .75;
    }
    @keyframes webSpin {
      to { transform: rotate(360deg); }
    }
    @keyframes weaveDraw {
      0% { stroke-dashoffset: 220; opacity: .2; }
      45% { stroke-dashoffset: 0; opacity: .85; }
      100% { stroke-dashoffset: -220; opacity: .2; }
    }
    .load-spider {
      transform-origin: 140px 148px;
      animation: spiderPulse 2.4s ease-in-out infinite;
    }
    @keyframes spiderPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03); }
    }
    .load-legs {
      transform-origin: 140px 150px;
      animation: loadLegs 1.8s ease-in-out infinite;
    }
    @keyframes loadLegs {
      0%, 100% { transform: rotate(-2deg); }
      50% { transform: rotate(2deg); }
    }
    .load-loupe {
      transform-origin: 140px 118px;
      animation: loupeOrbit 3.2s ease-in-out infinite;
    }
    @keyframes loupeOrbit {
      0% { transform: rotate(-28deg) translate(34px, -6px) rotate(12deg); }
      50% { transform: rotate(32deg) translate(34px, -6px) rotate(-8deg); }
      100% { transform: rotate(-28deg) translate(34px, -6px) rotate(12deg); }
    }
    .scan-status {
      margin-top: 28px;
      min-height: 1.5em;
      text-align: center;
      font: 600 16px/1.4 var(--font);
      color: var(--green-dark);
      letter-spacing: .01em;
    }
    .scan-status-dots::after {
      content: "";
      animation: dots 1.4s steps(4, end) infinite;
    }
    @keyframes dots {
      0% { content: ""; }
      25% { content: "."; }
      50% { content: ".."; }
      75% { content: "..."; }
    }
    .scan-sub {
      margin-top: 8px;
      font-size: 13px;
      color: var(--muted);
      text-align: center;
    }

    @media (max-width: 560px) {
      .hero-center { transform: translateY(3vh); }
      .logo { height: clamp(64px, 18vw, 88px); }
      .mascot-wrap { width: 88px; height: 100px; margin-top: 6px; }
      .brand { gap: 8px; margin-bottom: 14px; }
      .tagline { font-size: 13.5px; margin-bottom: 18px; }
      .search { height: 50px; padding-left: 14px; }
      .scan-btn { padding: 0 14px; font-size: 13px; }
      .lava-blob.b3, .lava-blob.b5 { width: 72px; height: 84px; }
      .scan-status { font-size: 14.5px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .web-ring, .web-spoke, .web-draw, .load-spider, .load-legs, .load-loupe, .scan-status-dots::after {
        animation: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="atmosphere" aria-hidden="true">
    <div class="lava-lamp">
      <div class="lava-pool"></div>
      <span class="lava-blob b1"></span>
      <span class="lava-blob b2"></span>
      <span class="lava-blob b3"></span>
      <span class="lava-blob b4"></span>
      <span class="lava-blob b5"></span>
      <span class="lava-blob b6"></span>
      <span class="lava-blob b7"></span>
      <span class="lava-blob b8"></span>
      <span class="lava-blob b9"></span>
    </div>
  </div>

<main class="page">
  <div class="hero-center">
    <div class="brand" role="img" aria-label="Spyvision">
      <div class="mascot-wrap">
        <div class="silk-up" aria-hidden="true"></div>
        <svg class="mascot" viewBox="0 0 130 150" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <defs>
            <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#F2F5F3"/>
              <stop offset="35%" stop-color="#B8C0BB"/>
              <stop offset="70%" stop-color="#7A847E"/>
              <stop offset="100%" stop-color="#4A534E"/>
            </linearGradient>
            <linearGradient id="metalDark" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#9AA39D"/>
              <stop offset="100%" stop-color="#4A534E"/>
            </linearGradient>
            <pattern id="bodyMatrix" width="8" height="10" patternUnits="userSpaceOnUse">
              <rect width="8" height="10" fill="#1F3D30"/>
              <text x="1" y="7" class="matrix-digits" fill="#3F9D75" font-size="6">01</text>
            </pattern>
            <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
              <feGaussianBlur stdDeviation="1.6" result="b"/>
              <feMerge>
                <feMergeNode in="b"/>
                <feMergeNode in="SourceGraphic"/>
              </feMerge>
            </filter>
            <radialGradient id="lensGrad" cx="40%" cy="35%" r="60%">
              <stop offset="0%" stop-color="#E8F6EE" stop-opacity=".95"/>
              <stop offset="55%" stop-color="#9AD4B4" stop-opacity=".55"/>
              <stop offset="100%" stop-color="#3A9B6E" stop-opacity=".35"/>
            </radialGradient>
          </defs>

          <g fill="none" stroke="#858585" stroke-linecap="round" opacity=".72">
            <path d="M65 4 L12 38 L20 118 L65 142 L110 118 L118 38 Z" stroke-width="1.1"/>
            <path d="M65 4 L65 142" stroke-width=".9" opacity=".85"/>
            <path d="M12 38 L118 38" stroke-width=".85"/>
            <path d="M20 118 L110 118" stroke-width=".85"/>
            <path d="M12 38 L110 118" stroke-width=".75"/>
            <path d="M118 38 L20 118" stroke-width=".75"/>
            <ellipse cx="65" cy="72" rx="14" ry="16" stroke-width=".85"/>
            <ellipse cx="65" cy="72" rx="26" ry="30" stroke-width=".9"/>
            <ellipse cx="65" cy="72" rx="38" ry="44" stroke-width=".95"/>
            <ellipse cx="65" cy="72" rx="50" ry="58" stroke-width="1"/>
            <path d="M65 72 L65 4" stroke-width=".85"/>
            <path d="M65 72 L118 38" stroke-width=".85"/>
            <path d="M65 72 L110 118" stroke-width=".85"/>
            <path d="M65 72 L65 142" stroke-width=".85"/>
            <path d="M65 72 L20 118" stroke-width=".85"/>
            <path d="M65 72 L12 38" stroke-width=".85"/>
            <path d="M65 72 L40 18" stroke-width=".7" stroke="#B7B7B7"/>
            <path d="M65 72 L90 18" stroke-width=".7" stroke="#B7B7B7"/>
            <path d="M65 72 L122 72" stroke-width=".7" stroke="#B7B7B7"/>
            <path d="M65 72 L8 72" stroke-width=".7" stroke="#B7B7B7"/>
          </g>

          <line x1="65" y1="0" x2="65" y2="52" stroke="#858585" stroke-width="1.5" stroke-linecap="round"/>
          <circle cx="65" cy="4" r="2.2" fill="#858585"/>

          <g transform="translate(5, 18)">
            <g class="leg-group" fill="none" stroke="url(#metalDark)" stroke-width="3.2" stroke-linecap="round">
              <path d="M48 48 C28 42, 18 28, 12 16"/>
              <path d="M46 54 C24 54, 14 48, 6 40"/>
              <path d="M46 62 C26 68, 16 78, 10 92"/>
              <path d="M50 66 C34 78, 28 92, 24 104"/>
              <path d="M72 48 C92 42, 102 28, 108 16"/>
              <path d="M74 54 C96 54, 106 48, 114 40"/>
              <path d="M74 62 C94 68, 104 78, 110 92"/>
              <path d="M70 66 C86 78, 92 92, 96 104"/>
            </g>
            <g fill="#858585">
              <circle cx="28" cy="36" r="2.2"/><circle cx="20" cy="50" r="2.2"/>
              <circle cx="24" cy="74" r="2.2"/><circle cx="36" cy="84" r="2.2"/>
              <circle cx="92" cy="36" r="2.2"/><circle cx="100" cy="50" r="2.2"/>
              <circle cx="96" cy="74" r="2.2"/><circle cx="84" cy="84" r="2.2"/>
            </g>

            <ellipse cx="60" cy="72" rx="22" ry="26" fill="url(#metal)"/>
            <ellipse cx="60" cy="72" rx="14" ry="18" fill="url(#bodyMatrix)" opacity=".85"/>
            <ellipse cx="60" cy="72" rx="22" ry="26" fill="none" stroke="#5A635E" stroke-width="1.2"/>

            <ellipse cx="60" cy="46" rx="18" ry="14" fill="url(#metal)"/>
            <ellipse cx="60" cy="46" rx="18" ry="14" fill="none" stroke="#5A635E" stroke-width="1.2"/>
            <rect x="50" y="40" width="20" height="10" rx="2" fill="url(#bodyMatrix)" opacity=".9"/>

            <g filter="url(#softGlow)">
              <ellipse class="eye-glow" cx="53" cy="44" rx="4.2" ry="4.8" fill="#1E5A42"/>
              <ellipse class="eye-glow" cx="67" cy="44" rx="4.2" ry="4.8" fill="#1E5A42"/>
              <circle cx="53" cy="44" r="2.4" fill="#3F9D75"/>
              <circle cx="67" cy="44" r="2.4" fill="#3F9D75"/>

      </p>
    </form>

  <script>
    (function () {
      var form = document.getElementById("scanForm");
      var input = document.getElementById("urlInput");
      var error = document.getElementById("urlError");
      var button = form.querySelector(".scan-btn");
      var overlay = document.getElementById("scanOverlay");
      var statusEl = document.getElementById("scanStatus");
      var statusTimer = null;
      var STATUS_MESSAGES = [
        "Подключаемся к сайту",
        "Обходим страницы",
        "Проверяем заголовки и cookies",
        "SAST: анализируем HTML и JavaScript",
        "Ищем служебные файлы (.git, .env, бэкапы)",
        "Проверяем тестовые и staging-разделы",
        "Broken Access Control: админки и IDOR",
        "Проверяем HTTPS, TLS и CORS",
        "Ищем признаки WAF и обходы фильтров",
        "DAST: активные тесты внедрения",
        "Собираем доказательства",
        "Формируем отчёт"
      ];

      function showError(msg) {
        error.style.color = "";
        error.textContent = msg || "";
        error.classList.toggle("show", !!msg);
      }

      function showOk(msg) {
        error.style.color = "var(--green)";
        error.textContent = msg;
        error.classList.add("show");
      }

      function setBusy(busy) {
        button.disabled = busy;
        input.disabled = busy;
        button.textContent = busy ? "Сканирование…" : "Сканировать";
        if (busy) {
          showScanOverlay();
        } else {
          hideScanOverlay();
        }
      }

      function showScanOverlay() {
        if (!overlay) return;
        var i = 0;
        statusEl.textContent = STATUS_MESSAGES[0];
        overlay.classList.add("open");
        overlay.setAttribute("aria-hidden", "false");
        clearInterval(statusTimer);
        statusTimer = setInterval(function () {
          i = (i + 1) % STATUS_MESSAGES.length;
          statusEl.textContent = STATUS_MESSAGES[i];
        }, 3200);
      }

      function hideScanOverlay() {
        if (!overlay) return;
        overlay.classList.remove("open");
        overlay.setAttribute("aria-hidden", "true");
        clearInterval(statusTimer);
        statusTimer = null;
      }

      function looksLikeUrl(value) {
        var v = value.trim();
        if (!v) return false;
        if (/^https?:\/\//i.test(v)) return true;
        if (/^[a-z0-9.-]+(?::\d{1,5})?(?:\/\S*)?$/i.test(v)) return true;
        if (/^\d{1,3}(?:\.\d{1,3}){3}(?::\d{1,5})?(?:\/\S*)?$/.test(v)) return true;
        if (/^\[[0-9a-f:]+\](?::\d{1,5})?(?:\/\S*)?$/i.test(v)) return true;
        return false;
      }

      function isFilePage() {
        return location.protocol === "file:";
      }

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        var value = input.value.trim();
        if (!value) {
          showError("Введите адрес для сканирования");
          input.focus();
          return;
        }
        if (!looksLikeUrl(value)) {
          showError("Похоже, это не URL. Пример: https://example.com");
          input.focus();
          return;
        }
        if (isFilePage()) {
          showError("Не удалось связаться с локальным сервером Spyvision. Запустите: python scan.py");
          return;
        }
        setBusy(true);
        showError("");
        fetch("/api/scan", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url: value })
        })
          .then(function (resp) {
            return resp.json().then(function (data) {
              return { ok: resp.ok, status: resp.status, data: data };
            }).catch(function () {
              return { ok: false, status: resp.status, data: { error: "Некорректный ответ сервера" } };
            });
          })
          .then(function (result) {
            if (result.ok && result.data && result.data.ok) {
              if (statusEl) statusEl.textContent = "Готово — открываем отчёт";
              var target = result.data.report_url || "/report.html";
              location.href = target;
              return;
            }
            var msg = (result.data && result.data.error)
              || ("Ошибка сканирования (HTTP " + result.status + ")");
            showError(msg);
            setBusy(false);
          })
          .catch(function () {
            showError("Не удалось связаться с локальным сервером Spyvision. Запустите: python scan.py");
            setBusy(false);
          });
      });

      document.querySelectorAll("[data-url]").forEach(function (link) {
        link.addEventListener("click", function (e) {
          e.preventDefault();
          input.value = link.getAttribute("data-url");
          input.focus();
          showError("");
        });
      });

      var rain = document.querySelector(".matrix-rain");
      if (rain) {
        var y = 0;
        setInterval(function () {
          y = (y + 1) % 12;
          rain.setAttribute("transform", "translate(0," + y + ")");
        }, 120);
      }

      if (isFilePage()) {
        showError("Не удалось связаться с локальным сервером Spyvision. Запустите: python scan.py");
      }
    })();
  </script>
