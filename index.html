<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Spyvision — анализ URL на уязвимости</title>
  <style>
    :root {
      --bg: #050a1b;
      --panel: rgba(12, 28, 58, .32);
      --panel-2: rgba(16, 36, 70, .42);
      --mint: rgba(0, 180, 230, .16);
      --mint-deep: rgba(0, 200, 255, .28);
      --green: #7EC8E8;
      --green-dark: #B8E4F6;
      --iron: #9BB4C8;
      --iron-light: #C0D6E6;
      --border: rgba(160, 210, 240, .38);
      --text: #E4F2FA;
      --muted: #A8C2D4;
      --safe: #6AD0BE;
      --high: #E89898;
      --cyan: #7ED4F0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      color: var(--text);
      background:
        linear-gradient(165deg, rgba(4, 10, 24, .28) 0%, rgba(6, 14, 32, .16) 45%, rgba(4, 8, 22, .32) 100%),
        url("bg.jfif") center/cover fixed no-repeat;
      font: 16px/1.65 "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 28px 24px 20px;
      overflow: visible;
    }

    /* —— Brand block: logo centered, spider above V —— */
    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-top: clamp(150px, 30vh, 340px);
      margin-bottom: 34px;
      animation: brandIn .7s ease both;
      position: relative;
      z-index: 2;
      width: 100%;
    }

    .brand-mark {
      position: relative;
      display: inline-block;
      max-width: min(620px, 78vw);
      line-height: 0;
    }

    @keyframes brandIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: none; }
    }

    .mascot-wrap {
      position: absolute;
      /* центр буквы V в viewBox логотипа: x=112 из 300 */
      left: 37.333%;
      bottom: 78%;
      transform: translateX(-50%);
      width: 132px;
      height: 148px;
      z-index: 3;
      animation: float 3.6s ease-in-out infinite;
      overflow: visible;
      pointer-events: none;
    }

    /* Нить паутины от края окна вниз к пауку */
    .silk-up {
      position: absolute;
      left: 50%;
      bottom: calc(100% - 6px);
      width: 1.5px;
      height: 100vh;
      margin-left: -0.75px;
      background: rgba(140, 200, 235, .7);
      opacity: .72;
      pointer-events: none;
      z-index: 0;
      border-radius: 1px;
      box-shadow: 0 0 8px rgba(120, 200, 240, .4);
    }
    .silk-up::before {
      content: "";
      position: absolute;
      top: 0;
      left: 50%;
      width: 5px;
      height: 5px;
      margin: -2px 0 0 -2.5px;
      border-radius: 50%;
      background: rgba(190, 230, 255, .95);
      opacity: .95;
      box-shadow: 0 0 10px rgba(140, 210, 250, .55);
    }

    .mascot {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      display: block;
      filter:
        drop-shadow(0 14px 28px rgba(0, 10, 30, .55))
        drop-shadow(0 4px 12px rgba(0, 140, 220, .35))
        brightness(1.12) hue-rotate(145deg) saturate(1.05);
      overflow: visible;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    .logo {
      display: block;
      height: 160px;
      width: auto;
      max-width: 100%;
      overflow: visible;
      filter: drop-shadow(0 8px 20px rgba(0, 10, 30, .5)) saturate(1.05) brightness(1.12);
      opacity: 1;
      margin: 0 auto;
    }

    .tagline {
      margin: -8px 0 32px;
      color: var(--muted);
      font-size: 17px;
      font-weight: 500;
      letter-spacing: .25px;
      text-align: center;
      animation: brandIn .7s .12s ease both;
      text-shadow: 0 1px 10px rgba(0, 8, 24, .65);
      opacity: 1;
    }

    /* —— Search (URL) —— */
    .search-wrap {
      width: min(700px, 100%);
      animation: brandIn .7s .22s ease both;
    }

    .search {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      height: 72px;
      padding: 0 12px 0 22px;
      background: rgba(14, 32, 64, .42);
      backdrop-filter: blur(18px) saturate(1.35);
      -webkit-backdrop-filter: blur(18px) saturate(1.35);
      border: 1.5px solid rgba(170, 215, 245, .42);
      border-radius: 30px;
      box-shadow:
        0 16px 40px rgba(0, 6, 20, .48),
        0 6px 0 rgba(0, 35, 65, .4),
        0 2px 0 rgba(0, 60, 100, .28),
        inset 0 1px 0 rgba(220, 240, 255, .4),
        inset 0 -1px 0 rgba(0, 40, 70, .2);
      transition: box-shadow .2s, border-color .2s, background .2s, transform .15s;
    }

    .search:hover {
      background: rgba(18, 40, 74, .52);
      border-color: rgba(180, 225, 250, .55);
      box-shadow:
        0 18px 46px rgba(0, 6, 20, .52),
        0 7px 0 rgba(0, 40, 70, .45),
        0 3px 0 rgba(0, 70, 110, .28),
        inset 0 1px 0 rgba(230, 245, 255, .5),
        inset 0 -1px 0 rgba(0, 40, 70, .22);
      transform: translateY(-2px);
    }

    .search:focus-within {
      border-color: rgba(160, 220, 255, .7);
      background: rgba(20, 46, 82, .58);
      box-shadow:
        0 0 0 3px rgba(100, 190, 240, .22),
        0 18px 46px rgba(0, 6, 20, .52),
        0 7px 0 rgba(0, 40, 70, .45),
        inset 0 1px 0 rgba(230, 245, 255, .55);
    }

    .search-ico {
      flex: none;
      color: var(--iron-light);
      display: flex;
      opacity: 1;
    }

    .search input {
      flex: 1;
      min-width: 0;
      border: none;
      outline: none;
      background: transparent;
      font: inherit;
      font-size: 18px;
      font-weight: 500;
      color: var(--text);
    }

    .search input::placeholder {
      color: rgba(168, 194, 212, .85);
      font-weight: 400;
    }

    .scan-btn {
      flex: none;
      height: 52px;
      padding: 0 32px;
      border: 1.5px solid rgba(180, 225, 250, .5);
      border-radius: 999px;
      background: linear-gradient(
        180deg,
        rgba(200, 235, 255, .48) 0%,
        rgba(90, 170, 220, .46) 42%,
        rgba(30, 110, 170, .58) 100%
      );
      color: #F2FAFF;
      font: 700 16px/1 "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      cursor: pointer;
      letter-spacing: .45px;
      backdrop-filter: blur(12px) saturate(1.3);
      -webkit-backdrop-filter: blur(12px) saturate(1.3);
      box-shadow:
        0 6px 0 rgba(0, 50, 85, .55),
        0 14px 32px rgba(0, 40, 90, .45),
        0 2px 0 rgba(0, 80, 130, .35),
        inset 0 1px 0 rgba(240, 250, 255, .55),
        inset 0 -2px 6px rgba(0, 40, 80, .25);
      transition: background .15s, transform .12s, box-shadow .15s, color .15s, border-color .15s;
    }

    .scan-btn:hover {
      background: linear-gradient(
        180deg,
        rgba(220, 245, 255, .62) 0%,
        rgba(110, 190, 235, .58) 42%,
        rgba(40, 130, 190, .68) 100%
      );
      border-color: rgba(200, 235, 255, .7);
      color: #FFFFFF;
      box-shadow:
        0 7px 0 rgba(0, 50, 85, .6),
        0 18px 36px rgba(0, 40, 90, .52),
        0 3px 0 rgba(0, 90, 140, .4),
        inset 0 1px 0 rgba(255, 255, 255, .65),
        inset 0 -2px 6px rgba(0, 40, 80, .28);
      transform: translateY(-3px);
    }

    .scan-btn:active {
      transform: translateY(2px);
      box-shadow:
        0 2px 0 rgba(0, 40, 70, .45),
        0 6px 16px rgba(0, 20, 50, .35),
        inset 0 1px 0 rgba(200, 230, 255, .22),
        inset 0 2px 6px rgba(0, 20, 40, .25);
    }

    .scan-btn:disabled {
      opacity: .65; cursor: wait; transform: none;
      box-shadow:
        0 4px 0 rgba(0, 40, 70, .35),
        0 10px 22px rgba(0, 20, 50, .3),
        inset 0 1px 0 rgba(200, 230, 255, .2);
    }

    .hint {
      margin-top: 16px;
      text-align: center;
      font-size: 14px;
      color: var(--muted);
      text-shadow: 0 1px 8px rgba(0, 8, 24, .6);
      opacity: 1;
    }

    .hint a {
      color: var(--green-dark);
      text-decoration: none;
      opacity: 1;
      font-weight: 600;
    }
    .hint a:hover { text-decoration: underline; }

    .error {
      margin-top: 12px;
      text-align: center;
      font-size: 14.5px;
      color: var(--high);
      min-height: 1.2em;
      opacity: 0;
      transition: opacity .2s;
      text-shadow: 0 1px 8px rgba(0, 8, 24, .6);
    }
    .error.show { opacity: 1; }

    /* Matrix rain on letter S */
    .matrix-digits {
      font-family: "Consolas", "Courier New", monospace;
      font-size: 5px;
      fill: #7ED4F0;
      opacity: .8;
    }

    /* Eye glow pulse */
    .eye-glow {
      animation: eyePulse 2.4s ease-in-out infinite;
    }
    @keyframes eyePulse {
      0%, 100% { opacity: .55; }
      50% { opacity: 1; }
    }

    /* Leg micro-motion */
    .leg-group {
      transform-origin: 60px 54px;
      animation: legWiggle 4s ease-in-out infinite;
    }
    @keyframes legWiggle {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(.8deg); }
    }
    /* Передние свисающие лапки (после переворота — «вниз» к логотипу) */
    .leg-front-l {
      transform-origin: 48px 48px;
      transform-box: view-box;
      animation: hangLegL 1.7s ease-in-out infinite;
    }
    .leg-front-r {
      transform-origin: 72px 48px;
      transform-box: view-box;
      animation: hangLegR 1.7s ease-in-out infinite;
      animation-delay: .18s;
    }
    .leg-front-joint-l {
      transform-origin: 48px 48px;
      transform-box: view-box;
      animation: hangLegL 1.7s ease-in-out infinite;
    }
    .leg-front-joint-r {
      transform-origin: 72px 48px;
      transform-box: view-box;
      animation: hangLegR 1.7s ease-in-out infinite;
      animation-delay: .18s;
    }
    @keyframes hangLegL {
      0%, 100% { transform: rotate(0deg); }
      40% { transform: rotate(-7deg); }
      70% { transform: rotate(3deg); }
    }
    @keyframes hangLegR {
      0%, 100% { transform: rotate(0deg); }
      35% { transform: rotate(7deg); }
      65% { transform: rotate(-3deg); }
    }

    footer {
      margin-top: auto;
      padding-top: 36px;
      width: 100%;
      text-align: center;
      font-size: 13.5px;
      color: var(--muted);
      text-shadow: 0 1px 8px rgba(0, 8, 24, .6);
      opacity: 1;
    }

    @media (max-width: 560px) {
      .mascot-wrap { width: 96px; height: 108px; bottom: 76%; }
      .logo { height: 112px; }
      .brand { margin-top: clamp(110px, 22vh, 220px); margin-bottom: 26px; }
      .brand-mark { max-width: min(420px, 82vw); }
      .tagline { font-size: 15px; margin-bottom: 26px; }
      .search { height: 58px; padding-left: 16px; }
      .search input { font-size: 16px; }
      .scan-btn { height: 46px; padding: 0 18px; font-size: 14px; }
    }

    /* —— Loading screen while scanning —— */
    .scan-loading {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        linear-gradient(165deg, rgba(3, 8, 20, .82) 0%, rgba(5, 14, 32, .78) 50%, rgba(2, 6, 16, .88) 100%),
        url("bg.jfif") center/cover fixed no-repeat;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }
    .scan-loading.open {
      display: flex;
    }
    .scan-loading-inner {
      width: min(420px, 100%);
      text-align: center;
      animation: loadIn .45s ease both;
    }
    @keyframes loadIn {
      from { opacity: 0; transform: translateY(14px) scale(.97); }
      to { opacity: 1; transform: none; }
    }
    .load-stage {
      position: relative;
      width: 220px;
      height: 240px;
      margin: 0 auto 22px;
    }
    .load-spider-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
      filter: drop-shadow(0 12px 28px rgba(0, 20, 50, .55));
    }
    .load-web-ring {
      fill: none;
      stroke: rgba(160, 210, 240, .55);
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 520;
      stroke-dashoffset: 520;
      animation: weaveRing 2.8s ease-in-out infinite;
    }
    .load-web-ring.r2 { animation-delay: .28s; stroke: rgba(140, 200, 235, .48); }
    .load-web-ring.r3 { animation-delay: .55s; stroke: rgba(130, 190, 230, .4); }
    .load-web-ring.r4 { animation-delay: .82s; stroke: rgba(120, 185, 225, .32); }
    .load-web-hub {
      fill: none;
      stroke: rgba(170, 215, 245, .5);
      stroke-width: 1;
      opacity: .7;
    }
    .load-web-spoke {
      fill: none;
      stroke: rgba(150, 200, 230, .42);
      stroke-width: 1.05;
      stroke-linecap: round;
      opacity: 0;
      animation: spokeFade 2.8s ease-in-out infinite;
    }
    @keyframes weaveRing {
      0% { stroke-dashoffset: 520; opacity: .15; }
      40% { stroke-dashoffset: 0; opacity: .9; }
      70% { stroke-dashoffset: 0; opacity: .65; }
      100% { stroke-dashoffset: -60; opacity: .12; }
    }
    @keyframes spokeFade {
      0%, 8% { opacity: 0; }
      30% { opacity: .75; }
      75% { opacity: .5; }
      100% { opacity: .15; }
    }
    .load-silk {
      stroke: rgba(180, 220, 245, .75);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-dasharray: 6 5;
      animation: silkFlow 1s linear infinite;
    }
    @keyframes silkFlow {
      to { stroke-dashoffset: -22; }
    }
    .load-spider-body {
      transform-origin: 110px 118px;
      animation: spiderWork 2.2s ease-in-out infinite;
    }
    @keyframes spiderWork {
      0%, 100% { transform: translate(0, 0) rotate(-4deg); }
      35% { transform: translate(6px, -8px) rotate(5deg); }
      65% { transform: translate(-5px, 4px) rotate(-6deg); }
    }
    .load-legs path {
      transform-origin: 110px 118px;
      animation: loadLegs 0.55s ease-in-out infinite alternate;
    }
    .load-legs path:nth-child(odd) { animation-delay: .12s; }
    @keyframes loadLegs {
      from { transform: rotate(-3deg); }
      to { transform: rotate(3deg); }
    }
    .load-glass {
      transform-origin: 120px 92px;
      animation: glassScan 1.8s ease-in-out infinite;
    }
    @keyframes glassScan {
      0%, 100% { transform: rotate(12deg) translate(0, 0); }
      50% { transform: rotate(-8deg) translate(-4px, 6px); }
    }
    .load-eye {
      animation: loadEye 1.2s ease-in-out infinite;
    }
    @keyframes loadEye {
      0%, 100% { opacity: .55; }
      50% { opacity: 1; }
    }
    .load-bits text {
      fill: #7ED4F0;
      font-family: Consolas, "Courier New", monospace;
      font-size: 9px;
      opacity: .0;
      animation: bitFall 2s linear infinite;
    }
    .load-bits text:nth-child(1) { animation-delay: 0s; }
    .load-bits text:nth-child(2) { animation-delay: .35s; }
    .load-bits text:nth-child(3) { animation-delay: .7s; }
    .load-bits text:nth-child(4) { animation-delay: 1.05s; }
    .load-bits text:nth-child(5) { animation-delay: 1.4s; }
    @keyframes bitFall {
      0% { opacity: 0; transform: translateY(-8px); }
      20% { opacity: .85; }
      100% { opacity: 0; transform: translateY(28px); }
    }
    .load-title {
      margin: 0 0 8px;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: .4px;
      color: #E4F2FA;
      text-shadow: 0 2px 12px rgba(0, 8, 24, .6);
    }
    .load-status {
      margin: 0 0 22px;
      min-height: 1.4em;
      font-size: 15px;
      color: #A8C2D4;
      text-shadow: 0 1px 8px rgba(0, 8, 24, .55);
      transition: opacity .25s;
    }
    .load-bar {
      width: min(280px, 100%);
      height: 6px;
      margin: 0 auto;
      border-radius: 999px;
      background: rgba(20, 40, 70, .55);
      border: 1px solid rgba(150, 200, 235, .28);
      overflow: hidden;
      box-shadow: inset 0 1px 3px rgba(0, 8, 24, .35);
    }
    .load-bar-fill {
      width: 42%;
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #3E8AB0, #7ED4F0, #B8E4F6);
      box-shadow: 0 0 12px rgba(126, 212, 240, .45);
      animation: barSlide 1.6s ease-in-out infinite;
    }
    @keyframes barSlide {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(280%); }
    }
    .load-hint {
      margin: 16px 0 0;
      font-size: 13px;
      color: rgba(168, 194, 212, .75);
    }
    body.scanning { overflow: hidden; }
  </style>
</head>
<body>
  <main class="page">
    <div class="brand" role="img" aria-label="Spyvision">
      <div class="brand-mark">
      <!-- Cyber spider hanging above letter V -->
      <div class="mascot-wrap">
        <div class="silk-up" aria-hidden="true"></div>
        <svg class="mascot" viewBox="0 0 130 150" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <defs>
            <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#E8ECE9"/>
              <stop offset="35%" stop-color="#A8B0AB"/>
              <stop offset="70%" stop-color="#6E7771"/>
              <stop offset="100%" stop-color="#3A433E"/>
            </linearGradient>
            <linearGradient id="metalDark" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#9AA39D"/>
              <stop offset="100%" stop-color="#4A534E"/>
            </linearGradient>
            <pattern id="bodyMatrix" width="8" height="10" patternUnits="userSpaceOnUse">
              <rect width="8" height="10" fill="#2A3330"/>
              <text x="1" y="7" class="matrix-digits" fill="#6EBFD8" font-size="6">01</text>
            </pattern>
            <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
              <feGaussianBlur stdDeviation="1.6" result="b"/>
              <feMerge>
                <feMergeNode in="b"/>
                <feMergeNode in="SourceGraphic"/>
              </feMerge>
            </filter>
            <radialGradient id="lensGrad" cx="40%" cy="35%" r="60%">
              <stop offset="0%" stop-color="#C8DCE8" stop-opacity=".9"/>
              <stop offset="60%" stop-color="#9CCFE6" stop-opacity=".55"/>
              <stop offset="100%" stop-color="#5A9AB8" stop-opacity=".35"/>
            </radialGradient>
          </defs>

          <!-- Hang web (behind spider) — figured orb web -->
          <g fill="none" stroke="#858585" stroke-linecap="round" stroke-linejoin="round" opacity=".78">
            <!-- Curved radial spokes -->
            <path d="M65 72 Q67.5 37.6 65 9.4" stroke-width=".95"/>
            <path d="M65 72 Q87 42.2 100.9 15.1" stroke-width=".95"/>
            <path d="M65 72 Q93.6 57.8 114.8 42.6" stroke-width=".95"/>
            <path d="M65 72 Q99.5 73.2 127.6 69.7" stroke-width=".95"/>
            <path d="M65 72 Q95.3 93.4 122.5 106.7" stroke-width=".95"/>
            <path d="M65 72 Q78 101.1 92.3 122.9" stroke-width=".95"/>
            <path d="M65 72 Q63.5 106.6 66.8 134.7" stroke-width=".95"/>
            <path d="M65 72 Q45 103.2 32.9 131" stroke-width=".95"/>
            <path d="M65 72 Q35.9 84.9 14 99.1" stroke-width=".95"/>
            <path d="M65 72 Q30.5 68.9 2.2 71" stroke-width=".95"/>
            <path d="M65 72 Q33.6 52.4 5.6 40.7" stroke-width=".95"/>
            <path d="M65 72 Q51 43.5 35.9 22.2" stroke-width=".95"/>
            <!-- Scalloped capture spirals -->
            <path d="M65 66.6 L67.9 67.4 L69.6 69.3 L70.4 71.8 L69.6 74.8 L67.5 76.8 L65.2 77.4 L62.4 76.7 L60.2 74.5 L59.6 71.9 L60.2 69.5 L62.3 67.3 Z" stroke-width=".7" opacity=".7"/>

        error.style.color = "var(--green)";
        error.textContent = msg;
        error.classList.add("show");
      }

      function setLoading(on) {
        if (!loading) { return; }
        loading.classList.toggle("open", on);
        loading.setAttribute("aria-hidden", on ? "false" : "true");
        document.body.classList.toggle("scanning", on);
        if (statusTimer) {
          clearInterval(statusTimer);
          statusTimer = null;
        }
        if (on && loadStatus) {
          statusIndex = 0;
          loadStatus.textContent = statusMessages[0];
          statusTimer = setInterval(function () {
            statusIndex = (statusIndex + 1) % statusMessages.length;
            loadStatus.style.opacity = "0";
            setTimeout(function () {
              loadStatus.textContent = statusMessages[statusIndex];
              loadStatus.style.opacity = "1";
            }, 220);
          }, 2800);
        }
      }

      function setBusy(busy) {
        button.disabled = busy;
        input.disabled = busy;
        button.textContent = busy ? "Сканирование…" : "Сканировать";
        setLoading(busy);
      }

      function looksLikeUrl(value) {
        var v = value.trim();
        if (!v) return false;
        if (/^https?:\/\//i.test(v)) return true;
        if (/^[a-z0-9.-]+(?::\d{1,5})?(?:\/\S*)?$/i.test(v)) return true;
        if (/^\d{1,3}(?:\.\d{1,3}){3}(?::\d{1,5})?(?:\/\S*)?$/.test(v)) return true;
        if (/^\[[0-9a-f:]+\](?::\d{1,5})?(?:\/\S*)?$/i.test(v)) return true;
        return false;
      }

      function isFilePage() {
        return location.protocol === "file:";
      }

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        var value = input.value.trim();
        if (!value) {
          showError("Введите адрес для сканирования");
          input.focus();
          return;
        }
        if (!looksLikeUrl(value)) {
          showError("Похоже, это не URL. Пример: https://example.com");
          input.focus();
          return;
        }
        if (isFilePage()) {
          showError("Откройте этот экран через локальный сервер: запустите python scan.py "
            + "в терминале и перейдите по адресу из консоли (не через file://).");
          return;
        }
        setBusy(true);
        showOk("Идёт сканирование, это может занять несколько минут…");
        fetch("/api/scan", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url: value })
        })
          .then(function (resp) {
            return resp.json().then(function (data) {
              return { ok: resp.ok, status: resp.status, data: data };
            }).catch(function () {
              return { ok: false, status: resp.status, data: { error: "Некорректный ответ сервера" } };
            });
          })
          .then(function (result) {
            if (result.ok && result.data && result.data.ok) {
              if (loadStatus) { loadStatus.textContent = "Готово. Открываю отчёт…"; }
              showOk("Готово. Открываю отчёт…");
              location.href = result.data.report_url || "/report.html";
              return;
            }
            var msg = (result.data && result.data.error)
              || ("Ошибка сканирования (HTTP " + result.status + ")");
            showError(msg);
            setBusy(false);
          })
          .catch(function () {
            showError("Не удалось связаться с локальным сервером Spyvision. Запустите: python scan.py");
            setBusy(false);
          });
      });

      document.querySelectorAll("[data-url]").forEach(function (link) {
        link.addEventListener("click", function (e) {
          e.preventDefault();
          input.value = link.getAttribute("data-url");
          input.focus();
          showError("");
        });
      });

      var rain = document.querySelector(".matrix-rain");
      if (rain) {
        var y = 0;
        setInterval(function () {
          y = (y + 1) % 12;
          rain.setAttribute("transform", "translate(0," + y + ")");
        }, 120);
      }

      if (isFilePage()) {
        showError("Для сканирования запустите python scan.py и откройте интерфейс по адресу из терминала.");
      }
    })();
  </script>
</body>
</html>
